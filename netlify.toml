# Netlify deployment config for the Next.js portfolio (lives in the web/ subfolder).
# The official Next.js runtime plugin lets the full app run — including the live
# GitHub repo strip (ISR) — no static export needed.

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
